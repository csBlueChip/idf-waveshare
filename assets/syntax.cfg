# syntax.cfg - SD manager viewer colours: key=#rrggbb or #rgb
# Built into the firmware; SD:/sys/syntax.cfg replaces it if present
# (FILES SYNEXPORT writes this built-in copy to SD:/sys/syntax_builtin.cfg).
# A key left out keeps its built-in colour. A bad line: the whole file is
# ignored (the page says which line) and the built-in colours are used.

# script files (.s)
s.keyword=#8cf      # IF LOOP FN LET ... (SCRIPTING.txt 3a)
s.directive=#c9f    # .STACK .CONST .FILES
s.command=#6cf      # first word of a command line (ECHO, LED ...)
s.variable=#fc6     # $x $$x ${..} (and [n] word index: brackets plain)
s.sysvar=#e9a       # $.name built-ins ($.ok $.err $.ret ...)
s.string=#9d9       # "..." '...'
s.number=#c9f
s.label=#f96        # :label
s.function=#fd8     # the name after FN / CALL
s.operator=#8cf     # AND OR
s.comment=#777      # # to the end of the line

# key=value files (.var .cfg .nvram): name, value, \ escapes / leading '!'
var.name=#fc6
var.value=#9d9
var.escape=#f96     # \n \" \\ \r

# folder descriptions (DESCRIPT.ION)
ion.name=#8cf
ion.text=#ddd

# line numbers (all text files)
line.number=#666
line.border=#333

# file list
list.hidden=#777    # FAT HIDDEN attribute (wins over SYSTEM)
list.system=#468    # FAT SYSTEM attribute

# status line
status.desc=#fd8    # the DESCRIPT.ION description after " | "

# ---- Words the viewer colours in script files (.s) - for PC editors ----
# Statements (s.keyword) when they start a statement (after ';' too):
#   LET GET VARS DEL INS IF ELIF ELSE END LOOP TO STEP WHILE TIMES FOREVER
#   BREAK NEXT SWITCH GOTO EXIT FN RETURN CALL INSERT ON OFF ONERROR QUIET
#   TRACE PRINT DEBUG FWRITE FREAD FTELL FSEEK FCLOSE RNG TIMER BPT! WAIT
#   INPUT
# Option words (s.keyword) only after their statement:
#   FSEEK: START END SET OFFS TAG     FREAD: EOL
#   LOOP: TO STEP WHILE TIMES FOREVER  WAIT: EVENT
#   ONERROR: STOP CONT GOTO           RNG: TRNG PRNG
#   VARS: SAVE LOAD ALL               ON: OFF
#   STOP: NOW
# CALL after '=' (LET $v = CALL f) is a statement word; the name after FN or
# CALL is s.function. In GET $v = cmd the word after '=' is s.command.
# Directives (s.directive): .STACK .CONST .FILES
# Built-in functions (s.function, when followed by '('):
#   INT ROUND ABS MIN MAX SQRT SIN COS ATAN2 LEN UPPER LOWER MID FIND RND
# Operators (s.operator): AND OR
# Labels (s.label): :name at the start of a statement; SWITCH cases a|b) *)
# Variables: $x $$x ${x} $${x} (s.variable), $.x (s.sysvar)
# Strings "..." '...' (s.string); numbers 12 -3.5 1e3 0x1F 0b101 (s.number)
# Comments (s.comment): '#' to the end of the line (not \#)
# Any other first word of a statement is a command (s.command).
