# debug.cfg - log volume per device, read at boot (no file: all 4)
#   0 off, 1 errors, 2 +warnings, 3 +info, 4 +DBG lines (full volume)
# Devices group the log tags:
#   BLE     ble NimBLE BLE_INIT BTDM_INIT BT_* hci*
#   WIFI    wifi pp net80211 phy* btbb_init esp_netif* lwip* dhcps
#   WEB     web httpd* esp_http_server dns
#   SD      sd sdmmc* SD_* diskio* vfs_fat* usbdisk tusb* TinyUSB
#   SCRIPT  script
#   IMU     imu
#   SYS     every other tag
# LOG DEBUG device n SAVE changes a line here; LOG DEBUG SAVE rewrites
# the file with all current settings (the old one is shown first).
# Messages before the SD card is mounted (ROM, bootloader, early
# start-up) are not filtered.
BLE=4
WIFI=4
WEB=4
SD=4
SCRIPT=4
IMU=4
SYS=4
